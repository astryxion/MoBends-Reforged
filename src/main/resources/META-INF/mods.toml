modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_homepage}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_homepage}"
authors = "${mod_authors}"
credits = "${mod_credits}"
description = '''${mod_description}'''
logoFile = "icon.png"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
mandatory = false
versionRange = "[1.16.5-4.0.0,)"
ordering = "BEFORE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "physicsmod"
mandatory = false
versionRange = "[1.0.0,)"
ordering = "BEFORE"
side = "CLIENT"
